<script>
// NOVA Player — app logic. Depends on NovaCodec (codec.js) being loaded first.
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const CONFIG_FILENAME = 'nova-player-config.json';
  const DB_NAME = 'nova-player-db', DB_STORE = 'handles', DB_KEY = 'musicDir';

  // ---------- IndexedDB: remember the chosen directory handle across sessions ----------
  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, val) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // ---------- App state ----------
  let dirHandle = null;
  let library = [];          // [{ id, name, fileHandle, path, tags, picture, sampleRate, numChannels, bitsPerSample, durationSeconds }]
  let playlists = {};        // { name: [trackId, ...] }
  let queue = [];            // [trackId, ...]
  let queuePos = -1;
  let currentView = { type: 'library' }; // { type: 'library' } | { type: 'playlist', name }
  let artworkUrls = new Map(); // trackId -> blob URL (cached)

  function trackById(id) { return library.find(t => t.id === id); }

  // ---------- Directory scanning ----------
  async function scanDirectory(handle) {
    // Revoke every blob URL from the outgoing library before replacing it — otherwise
    // each folder switch/rescan leaves the old artwork blobs unreleased for the rest
    // of the page's lifetime, a genuine unbounded leak over a long session.
    for (const url of artworkUrls.values()) URL.revokeObjectURL(url);
    artworkUrls.clear();
    decodeCache.clear(); // old library's tracks are gone — nothing in the cache is valid anymore
    library = [];
    setStatus('Scanning folder…');
    await walk(handle, '');
    setStatus(`Found ${library.length} track${library.length === 1 ? '' : 's'}.`);
    renderLibrary();
  }

  async function walk(handle, prefix) {
    for await (const entry of handle.values()) {
      if (entry.kind === 'directory') {
        await walk(entry, prefix + entry.name + '/');
      } else if (entry.kind === 'file' && /\.nova$/i.test(entry.name)) {
        try {
          const file = await entry.getFile();
          const buf = new Uint8Array(await file.arrayBuffer());
          const meta = NovaCodec.readMetadata(buf);
          const id = prefix + entry.name;
          library.push({
            id, name: entry.name, path: prefix, fileHandle: entry,
            tags: meta.tags || {}, picture: meta.picture || null,
            sampleRate: meta.sampleRate, numChannels: meta.numChannels,
            bitsPerSample: meta.bitsPerSample, durationSeconds: meta.durationSeconds,
          });
        } catch (err) {
          console.warn('Skipping unreadable file', entry.name, err);
        }
      }
    }
    library.sort((a, b) => (a.tags.title || a.name).localeCompare(b.tags.title || b.name));
  }

  function artworkUrlFor(track) {
    if (!track.picture || !track.picture.data || !track.picture.data.length) return null;
    if (artworkUrls.has(track.id)) return artworkUrls.get(track.id);
    const blob = new Blob([track.picture.data], { type: track.picture.mime || 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    artworkUrls.set(track.id, url);
    return url;
  }

  // ---------- Config persistence (real file, written into the chosen folder) ----------
  async function loadConfig() {
    try {
      const fh = await dirHandle.getFileHandle(CONFIG_FILENAME, { create: false });
      const file = await fh.getFile();
      const json = JSON.parse(await file.text());
      playlists = json.playlists || {};
    } catch (e) {
      playlists = {}; // no config yet — fresh folder
    }
    renderPlaylists();
  }
  let saveTimer = null;
  function saveConfigDebounced() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveConfig, 400);
  }
  async function saveConfig() {
    if (!dirHandle) return;
    try {
      const fh = await dirHandle.getFileHandle(CONFIG_FILENAME, { create: true });
      const writable = await fh.createWritable();
      await writable.write(JSON.stringify({ playlists, savedAt: new Date().toISOString() }, null, 2));
      await writable.close();
    } catch (err) {
      console.error('Could not save config file:', err);
      setStatus('Warning: could not save playlist config (' + err.message + ')');
    }
  }

  // ---------- Decode worker: keeps NovaCodec.decode() off the main thread ----------
  // decode() is synchronous and takes 10-30s+ on real files. Running it on the main
  // thread would freeze the UI during playback start AND during any background
  // prefetch — defeating the point of prefetching. One persistent worker, reused for
  // every decode request (current track and prefetches alike), processes them in order.
  let decodeWorker = null;
  let decodeRequestSeq = 0;
  const pendingDecodeRequests = new Map(); // requestId -> {resolve, reject}

  function getDecodeWorker() {
    if (decodeWorker) return decodeWorker;
    const codecSource = document.getElementById('codecSource').textContent;
    const workerSource = codecSource + `
      self.onmessage = function (e) {
        const { requestId, bytes } = e.data;
        try {
          const decoded = NovaCodec.decode(bytes);
          const transfer = decoded.channels.map(ch => ch.buffer);
          self.postMessage({ requestId, ok: true, decoded: {
            sampleRate: decoded.sampleRate, numChannels: decoded.numChannels,
            bitsPerSample: decoded.bitsPerSample, numFrames: decoded.numFrames,
            channels: decoded.channels,
          } }, transfer);
        } catch (err) {
          self.postMessage({ requestId, ok: false, error: err.message });
        }
      };
    `;
    const blob = new Blob([workerSource], { type: 'application/javascript' });
    decodeWorker = new Worker(URL.createObjectURL(blob));
    decodeWorker.onmessage = (e) => {
      const { requestId, ok, decoded, error } = e.data;
      const pending = pendingDecodeRequests.get(requestId);
      if (!pending) return; // stale/unknown — ignore
      pendingDecodeRequests.delete(requestId);
      if (ok) pending.resolve(decoded); else pending.reject(new Error(error));
    };
    decodeWorker.onerror = (e) => console.error('Decode worker error:', e);
    return decodeWorker;
  }

  function decodeInWorker(bytes) {
    const worker = getDecodeWorker();
    const requestId = ++decodeRequestSeq;
    return new Promise((resolve, reject) => {
      pendingDecodeRequests.set(requestId, { resolve, reject });
      worker.postMessage({ requestId, bytes }, [bytes.buffer]); // transfer, not copy
    });
  }

  function buildAudioBuffer(decoded) {
    const ctx = ensureCtx();
    const ab = ctx.createBuffer(decoded.numChannels, decoded.numFrames, decoded.sampleRate);
    const maxVal = Math.pow(2, decoded.bitsPerSample - 1);
    for (let c = 0; c < decoded.numChannels; c++) {
      const out = ab.getChannelData(c);
      const src = decoded.channels[c];
      for (let i = 0; i < decoded.numFrames; i++) out[i] = src[i] / maxVal;
    }
    return ab;
  }

  // ---------- Bounded decode cache ----------
  // Keeps at most current + next decoded AudioBuffers resident. Anything else is
  // explicitly dropped from the Map so the large Float32 buffers (hundreds of MB each
  // on multichannel files) can be garbage collected, not left to accumulate.
  const decodeCache = new Map();       // trackId -> AudioBuffer
  const inFlightDecodes = new Map();   // trackId -> Promise<AudioBuffer>

  function pruneCache(keepIds) {
    for (const id of decodeCache.keys()) if (!keepIds.includes(id)) decodeCache.delete(id);
  }

  async function getDecodedBuffer(track) {
    if (decodeCache.has(track.id)) return decodeCache.get(track.id);
    if (inFlightDecodes.has(track.id)) return inFlightDecodes.get(track.id);
    const p = (async () => {
      const file = await track.fileHandle.getFile();
      const buf = new Uint8Array(await file.arrayBuffer());
      const decoded = await decodeInWorker(buf);
      const ab = buildAudioBuffer(decoded);
      decodeCache.set(track.id, ab);
      return ab;
    })();
    inFlightDecodes.set(track.id, p);
    try { return await p; } finally { inFlightDecodes.delete(track.id); }
  }

  function prefetchNext() {
    const nextId = queue[queuePos + 1];
    if (!nextId) return;
    const track = trackById(nextId);
    if (!track) return;
    if (decodeCache.has(nextId) || inFlightDecodes.has(nextId)) return;
    getDecodedBuffer(track).then(() => {
      pruneCache([queue[queuePos], queue[queuePos + 1]].filter(Boolean));
    }).catch(err => console.warn('Prefetch failed for', track.name, err));
  }

  // ---------- Playback engine (raw Web Audio — supports seek via offset-based restart) ----------
  let audioCtx = null;
  let currentSource = null;
  let currentBuffer = null;
  let playStartedAtCtxTime = 0; // audioCtx.currentTime when playback of the current offset began
  let playOffset = 0;           // seconds into the track when it (re)started
  let isPlaying = false;
  let rafId = null;

  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const maxCh = audioCtx.destination.maxChannelCount || 2;
      try {
        audioCtx.destination.channelCount = Math.min(8, maxCh);
        audioCtx.destination.channelCountMode = 'explicit';
        audioCtx.destination.channelInterpretation = 'discrete';
      } catch (e) { /* some browsers restrict this; ignore and fall back to default */ }
    }
    return audioCtx;
  }

  function currentTimeSec() {
    if (!isPlaying) return playOffset;
    return playOffset + (audioCtx.currentTime - playStartedAtCtxTime);
  }

  function stopSource() {
    if (currentSource) {
      try { currentSource.onended = null; currentSource.stop(); } catch (e) {}
      currentSource = null;
    }
  }

  function startFrom(offset) {
    const ctx = ensureCtx();
    stopSource();
    const src = ctx.createBufferSource();
    src.buffer = currentBuffer;
    src.channelInterpretation = 'discrete';
    src.connect(ctx.destination);
    src.onended = () => { if (isPlaying && currentTimeSec() >= currentBuffer.duration - 0.05) onTrackEnded(); };
    src.start(0, Math.max(0, offset));
    currentSource = src;
    playOffset = offset;
    playStartedAtCtxTime = ctx.currentTime;
    isPlaying = true;
    updateTransportUI();
    tickProgress();
  }

  function pausePlayback() {
    if (!isPlaying) return;
    playOffset = currentTimeSec();
    stopSource();
    isPlaying = false;
    updateTransportUI();
  }

  function resumePlayback() {
    if (isPlaying || !currentBuffer) return;
    startFrom(playOffset);
  }

  function seekTo(offset) {
    if (!currentBuffer) return;
    const wasPlaying = isPlaying;
    stopSource();
    playOffset = Math.max(0, Math.min(currentBuffer.duration, offset));
    if (wasPlaying) startFrom(playOffset);
    else updateTransportUI();
  }

  function onTrackEnded() {
    isPlaying = false;
    playNextInQueue();
  }

  function tickProgress() {
    cancelAnimationFrame(rafId);
    function frame() {
      if (isPlaying) {
        const t = currentTimeSec();
        $('seekBar').value = currentBuffer ? (t / currentBuffer.duration) * 1000 : 0;
        $('timeCurrent').textContent = fmtTime(t);
        rafId = requestAnimationFrame(frame);
      }
    }
    frame();
  }

  async function playTrack(id, addQueueContext) {
    const track = trackById(id);
    if (!track) return;
    if (addQueueContext) {
      queue = addQueueContext;
      queuePos = queue.indexOf(id);
    }
    stopSource();
    isPlaying = false;
    currentBuffer = null;
    const cached = decodeCache.has(id);
    setNowPlaying(track, cached ? 'Ready' : 'Decoding…');
    $('playPauseBtn').disabled = true;
    try {
      const t0 = performance.now();
      const ab = await getDecodedBuffer(track);
      const t1 = performance.now();
      currentBuffer = ab;
      $('playPauseBtn').disabled = false;
      setNowPlaying(track, cached ? 'Ready (prefetched)' : `Decoded in ${((t1 - t0) / 1000).toFixed(1)}s`);
      $('timeTotal').textContent = fmtTime(ab.duration);
      startFrom(0);
      renderQueue();
      pruneCache([queue[queuePos], queue[queuePos + 1]].filter(Boolean));
      prefetchNext();
    } catch (err) {
      setNowPlaying(track, 'Error: ' + err.message);
      $('playPauseBtn').disabled = false;
      console.error(err);
    }
  }

  function playNextInQueue() {
    if (queuePos + 1 < queue.length) { queuePos++; playTrack(queue[queuePos]); }
    else { isPlaying = false; updateTransportUI(); }
  }
  function playPrevInQueue() {
    if (currentTimeSec() > 3) { seekTo(0); return; } // scrubby-back like most players
    if (queuePos > 0) { queuePos--; playTrack(queue[queuePos]); }
  }

  function fmtTime(sec) {
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function setNowPlaying(track, statusText) {
    $('npTitle').textContent = track.tags.title || track.name;
    $('npArtist').textContent = [track.tags.artist, track.tags.album].filter(Boolean).join(' — ');
    const art = artworkUrlFor(track);
    $('npArt').style.backgroundImage = art ? `url(${art})` : 'none';
    $('npStatus').textContent = statusText || '';
  }

  function updateTransportUI() {
    $('playPauseBtn').textContent = isPlaying ? '⏸' : '▶';
  }

  function setStatus(text) { $('statusLine').textContent = text; }

  // ---------- Queue management ----------
  function addToQueue(id) {
    queue.push(id);
    if (queuePos < 0) queuePos = 0;
    renderQueue();
    prefetchNext();
  }
  function addAllToQueue(ids) {
    queue.push(...ids);
    renderQueue();
    prefetchNext();
  }
  function removeFromQueue(index) {
    if (index === queuePos) { /* removing the currently playing item: just drop it from the list, keep playing */ }
    queue.splice(index, 1);
    if (index < queuePos) queuePos--;
    renderQueue();
    pruneCache([queue[queuePos], queue[queuePos + 1]].filter(Boolean));
    prefetchNext();
  }
  function moveQueueItem(from, to) {
    if (to < 0 || to >= queue.length) return;
    const [item] = queue.splice(from, 1);
    queue.splice(to, 0, item);
    if (queuePos === from) queuePos = to;
    else if (from < queuePos && to >= queuePos) queuePos--;
    else if (from > queuePos && to <= queuePos) queuePos++;
    renderQueue();
    pruneCache([queue[queuePos], queue[queuePos + 1]].filter(Boolean));
    prefetchNext();
  }

  // ---------- Playlist management ----------
  function createPlaylist(name) {
    if (!name || playlists[name]) return;
    playlists[name] = [];
    saveConfigDebounced();
    renderPlaylists();
  }
  function deletePlaylist(name) {
    delete playlists[name];
    if (currentView.type === 'playlist' && currentView.name === name) currentView = { type: 'library' };
    saveConfigDebounced();
    renderPlaylists();
    renderLibrary();
  }
  function addTrackToPlaylist(name, id) {
    if (!playlists[name].includes(id)) playlists[name].push(id);
    saveConfigDebounced();
    if (currentView.type === 'playlist' && currentView.name === name) renderLibrary();
  }
  function removeTrackFromPlaylist(name, id) {
    playlists[name] = playlists[name].filter(x => x !== id);
    saveConfigDebounced();
    if (currentView.type === 'playlist' && currentView.name === name) renderLibrary();
  }

  // ---------- Rendering ----------
  function trackRowHtml(track, opts) {
    opts = opts || {};
    const art = artworkUrlFor(track);
    const dur = fmtTime(track.durationSeconds);
    const chLabel = track.numChannels > 2 ? `${track.numChannels}ch` : (track.numChannels === 2 ? 'stereo' : 'mono');
    return `<div class="track-row" data-id="${escapeAttr(track.id)}">
      <div class="track-art" style="background-image:${art ? `url(${art})` : 'none'}"></div>
      <div class="track-info">
        <div class="track-title">${escapeHtml(track.tags.title || track.name)}</div>
        <div class="track-sub">${escapeHtml(track.tags.artist || '')}${track.tags.album ? ' — ' + escapeHtml(track.tags.album) : ''}</div>
      </div>
      <div class="track-meta">${chLabel} · ${track.bitsPerSample}-bit</div>
      <div class="track-dur">${dur}</div>
      <button class="icon-btn queue-add" title="Add to queue">+Q</button>
      <button class="icon-btn playlist-add" title="Add to playlist">+PL</button>
      ${opts.removable ? '<button class="icon-btn track-remove" title="Remove from playlist">✕</button>' : ''}
    </div>`;
  }

  function renderLibrary() {
    const list = currentView.type === 'library'
      ? library
      : (playlists[currentView.name] || []).map(trackById).filter(Boolean);
    const q = $('searchBox').value.trim().toLowerCase();
    const filtered = q
      ? list.filter(t => (t.tags.title || t.name).toLowerCase().includes(q) || (t.tags.artist || '').toLowerCase().includes(q) || (t.tags.album || '').toLowerCase().includes(q))
      : list;
    $('viewTitle').textContent = currentView.type === 'library' ? 'Library' : currentView.name;
    $('viewCount').textContent = filtered.length + ' track' + (filtered.length === 1 ? '' : 's');
    $('trackList').innerHTML = filtered.length
      ? filtered.map(t => trackRowHtml(t, { removable: currentView.type === 'playlist' })).join('')
      : '<div class="empty-hint">No tracks here yet.</div>';
  }

  function renderPlaylists() {
    const names = Object.keys(playlists).sort();
    $('playlistList').innerHTML =
      `<div class="playlist-item ${currentView.type === 'library' ? 'active' : ''}" data-view="library">📚 Library</div>` +
      names.map(n => `<div class="playlist-item ${currentView.type === 'playlist' && currentView.name === n ? 'active' : ''}" data-view="playlist" data-name="${escapeAttr(n)}">🎵 ${escapeHtml(n)} <span class="pl-remove" data-name="${escapeAttr(n)}">✕</span></div>`).join('');
  }

  function renderQueue() {
    $('queueList').innerHTML = queue.length
      ? queue.map((id, i) => {
        const t = trackById(id);
        if (!t) return '';
        return `<div class="queue-row ${i === queuePos ? 'playing' : ''}" data-index="${i}">
          <span class="q-num">${i === queuePos ? '▶' : i + 1}</span>
          <span class="q-title">${escapeHtml(t.tags.title || t.name)}</span>
          <button class="icon-btn q-up" title="Move up">↑</button>
          <button class="icon-btn q-down" title="Move down">↓</button>
          <button class="icon-btn q-remove" title="Remove">✕</button>
        </div>`;
      }).join('')
      : '<div class="empty-hint">Queue is empty.</div>';
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

  // ---------- Event wiring ----------
  function wireEvents() {
    $('selectFolderBtn').addEventListener('click', selectFolder);

    $('searchBox').addEventListener('input', renderLibrary);

    $('newPlaylistBtn').addEventListener('click', () => {
      const name = prompt('New playlist name:');
      if (name) createPlaylist(name.trim());
    });

    $('playlistList').addEventListener('click', (e) => {
      const removeName = e.target.closest('.pl-remove');
      if (removeName) { if (confirm('Delete playlist "' + removeName.dataset.name + '"?')) deletePlaylist(removeName.dataset.name); return; }
      const item = e.target.closest('.playlist-item');
      if (!item) return;
      currentView = item.dataset.view === 'library' ? { type: 'library' } : { type: 'playlist', name: item.dataset.name };
      renderPlaylists();
      renderLibrary();
    });

    $('trackList').addEventListener('click', (e) => {
      const row = e.target.closest('.track-row');
      if (!row) return;
      const id = row.dataset.id;
      if (e.target.closest('.queue-add')) { addToQueue(id); return; }
      if (e.target.closest('.playlist-add')) { showPlaylistPicker(id); return; }
      if (e.target.closest('.track-remove')) { removeTrackFromPlaylist(currentView.name, id); return; }
      // plain click on the row: play now, queue = the rest of the current view from this point on
      const list = currentView.type === 'library' ? library : (playlists[currentView.name] || []).map(trackById).filter(Boolean);
      const ids = list.map(t => t.id);
      playTrack(id, ids);
    });

    $('queueList').addEventListener('click', (e) => {
      const row = e.target.closest('.queue-row');
      if (!row) return;
      const idx = parseInt(row.dataset.index, 10);
      if (e.target.closest('.q-remove')) { removeFromQueue(idx); return; }
      if (e.target.closest('.q-up')) { moveQueueItem(idx, idx - 1); return; }
      if (e.target.closest('.q-down')) { moveQueueItem(idx, idx + 1); return; }
      // click elsewhere on a queue row: jump to that track
      queuePos = idx;
      playTrack(queue[idx]);
    });

    $('playPauseBtn').addEventListener('click', () => {
      if (!currentBuffer) return;
      if (isPlaying) pausePlayback(); else resumePlayback(); tickProgress();
      updateTransportUI();
    });
    $('nextBtn').addEventListener('click', playNextInQueue);
    $('prevBtn').addEventListener('click', playPrevInQueue);
    $('seekBar').addEventListener('input', () => {
      if (!currentBuffer) return;
      seekTo((parseFloat($('seekBar').value) / 1000) * currentBuffer.duration);
    });
  }

  function showPlaylistPicker(trackId) {
    const names = Object.keys(playlists);
    if (!names.length) { alert('Create a playlist first (top-left "+ New Playlist").'); return; }
    const choice = prompt('Add to which playlist?\n' + names.map((n, i) => (i + 1) + '. ' + n).join('\n') + '\n\nEnter a number:');
    const idx = parseInt(choice, 10) - 1;
    if (names[idx]) addTrackToPlaylist(names[idx], trackId);
  }

  async function selectFolder() {
    if (!('showDirectoryPicker' in window)) {
      alert('Your browser doesn\'t support folder access (needs Chrome, Edge, Opera, or Vivaldi). Firefox and Safari aren\'t supported yet.');
      return;
    }
    try {
      dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      await idbSet(DB_KEY, dirHandle);
      $('folderName').textContent = dirHandle.name;
      await loadConfig();
      await scanDirectory(dirHandle);
    } catch (err) {
      if (err.name !== 'AbortError') { console.error(err); setStatus('Could not open folder: ' + err.message); }
    }
  }

  async function tryRestoreFolder() {
    try {
      const handle = await idbGet(DB_KEY);
      if (!handle) return;
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted' || (await handle.requestPermission({ mode: 'readwrite' })) === 'granted') {
        dirHandle = handle;
        $('folderName').textContent = dirHandle.name;
        await loadConfig();
        await scanDirectory(dirHandle);
      } else {
        setStatus('Click "Select Music Folder" to grant access again.');
      }
    } catch (err) {
      console.warn('Could not restore previous folder:', err);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    wireEvents();
    renderPlaylists();
    renderLibrary();
    renderQueue();
    if (!('showDirectoryPicker' in window)) {
      setStatus('This browser doesn\'t support the File System Access API — try Chrome, Edge, Opera, or Vivaldi.');
    } else {
      tryRestoreFolder();
    }
  });
})();

</script>
</body>
</html>
